<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- CSP صارمة: لا eval، لا سكربتات خارجية. wasm-unsafe-eval مطلوب فقط لمحاكي v86. المضيفون المسموحان لتطبيق Faisal AI فقط: api.groq.com و api.deepseek.com. faisal-os.pages.dev هو وسيط المالك السحابي (قراءة فقط، برمز سري)، يحتاجه الرابط الاحتياطي على GitHub Pages. api.wikimedia.org مسموح لتطبيق البحث داخل النظام (واجهة REST مفتوحة، بلا مفتاح، بلا كوكيز).
       يُسمح بـ http للعناوين المحلية (127.0.0.1 و localhost) وحدها، لأن حاوية المتصفح المُبثّ التي يشغّلها المستخدم بنفسه تعمل على جهازه؛ أي عنوان بعيد يجب أن يكون https. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://api.groq.com https://api.deepseek.com https://api.wikimedia.org https://faisal-os.pages.dev http://127.0.0.1:* http://localhost:*; worker-src 'self' blob:; frame-src https: http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Fai$al OS</title>
  <meta name="theme-color" content="#16264F" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='%2316264F'/%3E%3Cg transform='translate(32 32.4) scale(.9) translate(-32 -30.6)'%3E%3Cpath d='M32 16.2V55.6' fill='none' stroke='%23E3B650' stroke-width='4.2'/%3E%3Cpath d='M38.55 21.91A8 8 0 1 0 32 34.5A8 8 0 1 1 25.45 47.09' fill='none' stroke='%23E3B650' stroke-width='7.2' stroke-linecap='butt'/%3E%3Cpath d='M32 5.6L35.4 9L32 12.4L28.6 9Z' fill='%23E3B650'/%3E%3C/g%3E%3C/svg%3E" />
  <!-- رسم أولي ثابت: يراه المستخدم قبل أن يُقلع JavaScript، فلا تظهر صفحة بيضاء فارغة. يُزال في src/main.ts. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0E1A3A; }
    #faisal-boot {
      position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
      color: #F7F1E3; text-align: center; text-transform: none;
      font: 500 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    #faisal-boot b { font-size: 30px; letter-spacing: .04em; color: #E3B650; font-weight: 600; }
    #faisal-boot span { letter-spacing: .1em; opacity: .75; }
    #faisal-boot .faisal-boot-error { display: grid; gap: 10px; max-inline-size: 32rem; padding-inline: 20px; }
    #faisal-boot .faisal-boot-error p { margin: 0; opacity: .85; }
    #faisal-boot .faisal-boot-error code {
      font: 400 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      opacity: .7; overflow-wrap: anywhere; direction: ltr;
    }
    #faisal-boot .faisal-boot-error button {
      justify-self: center; margin-block-start: 6px; padding: 8px 18px; border-radius: 8px;
      border: 1px solid #E3B650; background: transparent; color: #E3B650;
      font: inherit; cursor: pointer;
    }
    #faisal-boot .faisal-boot-error button:focus-visible { outline: 2px solid #F0CF7A; outline-offset: 2px; }
    @media (prefers-reduced-motion: no-preference) {
      #faisal-boot::after {
        content: ''; inline-size: 132px; block-size: 3px; margin-inline: auto; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #E3B650, transparent);
        animation: faisal-boot-sweep 1.1s ease-in-out infinite;
      }
    }
    @keyframes faisal-boot-sweep { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="faisal-boot" aria-hidden="true"><b>Fai$al OS</b><span>فيصل</span></div>
  <div id="faisal-root"></div>
  <noscript>
    <p style="color:#F7F1E3;font:500 15px/1.6 system-ui,sans-serif;text-align:center;padding:24px">
      Fai$al OS needs JavaScript.<br />
      يحتاج Fai$al OS إلى تشغيل JavaScript.
    </p>
  </noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
