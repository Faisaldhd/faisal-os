# Builds the desktop (Electron) app and publishes it as a GitHub Release when a
# version tag is pushed (`npm version patch && git push --follow-tags`).
# Installed copies check these releases and update themselves (electron/main.cjs).
name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      # Build only; the release job below publishes every platform at once.
      - run: npx vite build
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-desktop
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-desktop/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Fai\$al OS $GITHUB_REF_NAME" \
            --generate-notes
