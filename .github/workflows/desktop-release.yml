# Every push to main (a merged PR from anyone, human or agent) builds the
# desktop (Electron) app and publishes it as a new GitHub Release. Installed
# copies check these releases and update themselves (electron/main.cjs), so a
# merge reaches the installed app with no manual step.
#
# Versioning is automatic: the next patch after the latest release
# (v1.0.4 → v1.0.5), keeping package.json's major.minor. Bump major/minor in
# package.json to start a new series. Nothing is committed back to the repo.
name: Desktop release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# One release at a time, in merge order, so two quick merges can't claim the same version.
concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Next version
        id: next
        run: |
          # Highest patch already used in this major.minor series — by any tag
          # (a release in flight has its tag before its release) or by
          # package.json — plus one, so this never reuses a version.
          series=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          pkg_patch=$(node -p "require('./package.json').version.split('.')[2]")
          tag_patch=$(git ls-remote --tags origin "refs/tags/v$series.*" \
            | sed -nE "s#.*refs/tags/v${series//./\\.}\.([0-9]+)\$#\1#p" | sort -n | tail -1)
          patch=$(( (${tag_patch:-0} > pkg_patch ? ${tag_patch:-0} : pkg_patch) + 1 ))
          echo "version=$series.$patch" >> "$GITHUB_OUTPUT"
          echo "Releasing $series.$patch"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The installer and its update manifest carry this version; not committed.
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npx vite build
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-desktop
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist-desktop/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fai\$al OS $TAG" \
            --generate-notes
